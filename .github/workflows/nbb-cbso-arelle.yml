name: nbb-cbso (Arelle)

# Validates what @financica/nbb-cbso renders with Arelle against the NBB's
# own taxonomy package: XBRL Dimensions and every formula linkbase, the
# completeness rules included. Only for this package, and only when it (or
# the XBRL writer it renders with) changes.

on:
    push:
        branches: [main]
        paths:
            - packages/nbb-cbso/**
            - packages/xbrl/**
            - bun.lock
            - .github/workflows/nbb-cbso-arelle.yml
    pull_request:
        paths:
            - packages/nbb-cbso/**
            - packages/xbrl/**
            - bun.lock
            - .github/workflows/nbb-cbso-arelle.yml

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # The package also carries the 25.0 framework, so one download validates
    # both releases the package ships. A new January release changes the
    # version and the `taxo<year>` folder of the URL below.
    NBB_TAXONOMY_VERSION: 26.0.15
    NBB_TAXONOMY_URL: https://www.nbb.be/doc/ba/xbrl/taxo2026/nbb-cbso-26.0.15.zip
    ARELLE_VERSION: 2.47.5

jobs:
    arelle:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: bun install --frozen-lockfile
            - run: python -m pip install "arelle-release==${ARELLE_VERSION}"
            - uses: actions/cache@v4
              id: taxonomy
              with:
                  path: .nbb-taxonomy
                  key: nbb-cbso-taxonomy-${{ env.NBB_TAXONOMY_VERSION }}
            - if: steps.taxonomy.outputs.cache-hit != 'true'
              run: curl -fsSL --create-dirs -o ".nbb-taxonomy/nbb-cbso-${NBB_TAXONOMY_VERSION}.zip" "$NBB_TAXONOMY_URL"
            - run: bun run test:arelle
              working-directory: packages/nbb-cbso
              env:
                  NBB_ARELLE: arelleCmdLine
                  NBB_TAXONOMY_PACKAGE: ${{ github.workspace }}/.nbb-taxonomy/nbb-cbso-${{ env.NBB_TAXONOMY_VERSION }}.zip
